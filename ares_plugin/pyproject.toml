[project]
name = "lexicon-ares-gate"
version = "1.0.0"
description = "ARES gate plugin for Lexicon: block when execution accuracy drops > 2 points or a protected bucket gets worse."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."ares.gate_plugins"]
lexicon = "lexicon_ares_gate:LexiconGate"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lexicon_ares_gate"]
