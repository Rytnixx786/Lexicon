[project]
name = "lexicon"
version = "0.1.0"
description = "A text-to-SQL analyst agent over Tally's warehouse, with a measured context layer, typed refusals, clarification, and an ARES regression gate."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "sqlglot>=30.0",
    "psycopg[binary]>=3.2",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rank-bm25>=0.2.2",
    "model2vec>=0.4",
    "rapidfuzz>=3.9",
    "matplotlib>=3.9",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
app = ["streamlit>=1.39", "plotly>=5.24"]
# ARES gate runtime: ARES itself is imported read-only from ARES_PATH (never installed or edited);
# these are the modules its gate code imports.
gate = ["pydantic-settings>=2.2", "structlog>=24.1"]

[project.scripts]
lexicon = "lexicon.cli:app"

[dependency-groups]
dev = [
    "lexicon-ares-gate",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[tool.uv.sources]
lexicon-ares-gate = { path = "ares_plugin", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexicon"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "ares_plugin"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806", "PT018", "PT017"]
"src/lexicon/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lexicon"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "model2vec.*", "statsmodels.*", "scipy.*", "matplotlib.*", "huggingface_hub.*", "ares.*", "lexicon_ares_gate.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "ares_plugin/tests"]
pythonpath = [".", "ares_plugin"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs the Lexicon eval Postgres (docker compose up -d)",
    "llm: needs a served model behind Cinch",
]

[tool.coverage.run]
source = ["src/lexicon"]
branch = true
omit = ["src/lexicon/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
