bucket: metric_definition
items:
  - id: G-D-01
    question: What is the cost per correct triage of each setup on the test split?
    tests_metrics: [cost_per_correct]
    gold_sql: |
      select setup, sum(total_cost_usd) / nullif(count(*) filter (where is_correct), 0)
      from marts.fct_outcomes where split = 'test' and arm = 'primary' group by setup
  - id: G-D-02
    question: What is the accuracy of each setup on the test split?
    tests_metrics: [accuracy]
    gold_sql: select setup, avg(is_correct::int) from marts.fct_outcomes where split = 'test' and arm = 'primary' group by setup
  - id: G-D-03
    question: What was the total cost of each setup's decisions on the test split?
    tests_metrics: [total_cost]
    gold_sql: select setup, sum(total_cost_usd) from marts.fct_outcomes where split = 'test' and arm = 'primary' group by setup
  - id: G-D-04
    question: What was the cache hit rate of model calls in the cache_on arm?
    tests_metrics: [cache_hit_rate]
    gold_sql: select count(*) filter (where cache_status = 'HIT')::numeric / count(*) from marts.fct_requests where arm = 'cache_on'
  - id: G-D-05
    question: What is the misroute rate of each real tenant?
    tests_metrics: [misroute_rate]
    gold_sql: |
      select tenant_id, count(*) filter (where ai_predicted_intent is distinct from final_intent)::numeric / count(*)
      from support.tickets where tenant_id not like 'test-%' group by tenant_id
  - id: G-D-06
    question: What is the overall reopen rate of tickets?
    tests_metrics: [reopen_rate]
    gold_sql: |
      select count(distinct e.ticket_id) filter (where e.event_type = 'reopened')::numeric
             / count(distinct e.ticket_id) filter (where e.event_type = 'resolved')
      from support.ticket_events e join support.tickets t on t.ticket_id = e.ticket_id
      where t.tenant_id not like 'test-%'
  - id: G-D-07
    question: What share of tickets were escalated to a human at least once?
    tests_metrics: [human_escalation_rate]
    gold_sql: |
      select count(distinct e.ticket_id) filter (where e.event_type = 'escalated_to_human')::numeric / count(distinct e.ticket_id)
      from support.ticket_events e join support.tickets t on t.ticket_id = e.ticket_id
      where t.tenant_id not like 'test-%'
  - id: G-D-08
    question: What is the average latency per model call of the local model on the test split?
    tests_metrics: [avg_latency_per_call]
    gold_sql: select avg(latency_ms) from marts.fct_requests where setup = 'B_local' and split = 'test' and arm = 'primary'
  - id: G-D-09
    question: What is the local model's cost per correct triage for each tenant on the test split?
    tests_metrics: [cost_per_correct]
    gold_sql: |
      select tenant_id, sum(total_cost_usd) / nullif(count(*) filter (where is_correct), 0)
      from marts.fct_outcomes where setup = 'B_local' and split = 'test' and arm = 'primary' group by tenant_id
  - id: G-D-10
    question: How many resolved tickets does each real tenant have?
    tests_metrics: [resolved_tickets]
    tests_rules: [R-RESOLVED-IS-STATUS]
    gold_sql: |
      select tenant_id, count(*) from support.tickets
      where status in ('resolved', 'closed') and tenant_id not like 'test-%' group by tenant_id
  - id: G-D-11
    question: What is the SLA breach rate for each priority, based on time to first resolution?
    tests_metrics: [sla_breach_rate]
    difficulty: hard
    gold_sql: |
      with first_res as (
        select ticket_id, min(event_at) as first_resolved_at from support.ticket_events where event_type = 'resolved' group by ticket_id
      )
      select t.priority,
             avg((f.first_resolved_at - t.opened_at > make_interval(hours => s.resolution_hours))::int) as breach_rate
      from support.tickets t
      join first_res f on f.ticket_id = t.ticket_id
      join support.sla_policies s on s.tenant_id = t.tenant_id and s.priority = t.priority
      where t.tenant_id not like 'test-%'
      group by t.priority
  - id: G-D-12
    question: On the tune split, what was the local model's accuracy with each prompt version?
    tests_metrics: [accuracy]
    gold_sql: |
      select prompt_version, avg(is_correct::int) from marts.fct_outcomes
      where setup = 'B_local' and split = 'tune' group by prompt_version
  - id: G-D-13
    question: By how many percentage points did the TF-IDF baseline beat the local model on test-split accuracy?
    tests_metrics: [accuracy]
    gold_sql: |
      select 100 * (avg(is_correct::int) filter (where setup = 'A_tfidf') - avg(is_correct::int) filter (where setup = 'B_local'))
      from marts.fct_outcomes where split = 'test' and arm = 'primary'
  - id: G-D-14
    question: On the test split, what was the local model's cost per correct triage with the semantic cache on versus off?
    tests_metrics: [cost_per_correct]
    gold_sql: |
      select arm, sum(total_cost_usd) / nullif(count(*) filter (where is_correct), 0)
      from marts.fct_outcomes where setup = 'B_local' and split = 'test' and arm in ('primary', 'cache_on') group by arm
  - id: G-D-15
    question: What was the local model's test-split accuracy for each gold category?
    tests_metrics: [accuracy]
    gold_sql: |
      select gold_category, avg(is_correct::int) from marts.fct_outcomes
      where setup = 'B_local' and split = 'test' and arm = 'primary' group by gold_category
  - id: G-D-16
    question: What share of the local model's test-split decisions produced an invalid output?
    gold_sql: select avg((not valid)::int) from marts.fct_outcomes where setup = 'B_local' and split = 'test' and arm = 'primary'
  - id: G-D-17
    question: What is the average total number of tokens (input plus output) per vllm call on the test split?
    gold_sql: |
      select avg(input_tokens + output_tokens) from marts.fct_requests
      where provider = 'vllm' and split = 'test' and arm = 'primary'
  - id: G-D-18
    question: What did the TF-IDF baseline cost per 1,000 correct triages on the test split?
    tests_metrics: [cost_per_correct]
    gold_sql: |
      select 1000 * sum(total_cost_usd) / nullif(count(*) filter (where is_correct), 0)
      from marts.fct_outcomes where setup = 'A_tfidf' and split = 'test' and arm = 'primary'
  - id: G-D-19
    question: What is the median time to first resolution in hours for each real tenant?
    gold_sql: |
      with first_res as (
        select ticket_id, min(event_at) as first_resolved_at from support.ticket_events where event_type = 'resolved' group by ticket_id
      )
      select t.tenant_id, percentile_cont(0.5) within group (order by extract(epoch from f.first_resolved_at - t.opened_at) / 3600)
      from support.tickets t join first_res f on f.ticket_id = t.ticket_id
      where t.tenant_id not like 'test-%'
      group by t.tenant_id
  - id: G-D-20
    question: What was the local model's test-split accuracy on tickets with typos (flag Z)?
    tests_metrics: [accuracy]
    gold_sql: |
      select avg(is_correct::int) from marts.fct_outcomes
      where setup = 'B_local' and split = 'test' and arm = 'primary' and flags like '%Z%'
